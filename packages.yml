# dbt package dependencies.
# Run from project root using the project venv (avoids dbt Cloud CLI / dbt_cloud.yml errors):
#   DBT_PROFILES_DIR=. .venv/bin/dbt deps
# https://docs.getdbt.com/docs/build/packages
# metaplane/dbt_expectations is the maintained fork (calogica/dbt_expectations is deprecated).

packages:
  - package: metaplane/dbt_expectations
    version: 0.10.10
  - package: godatadriven/dbt_date
    version: 0.17.1
