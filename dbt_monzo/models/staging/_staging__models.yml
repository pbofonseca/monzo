# Staging models: schema and documentation.
# Uniqueness on natural keys is asserted by singular tests in tests/.

version: 2

models:
  - name: stg_accounts_created
    description: Staging layer for account_created. Deduplicated on (account_id_hashed, created_ts).
    columns:
      - name: account_id_hashed
        description: Hashed account identifier (part of natural key with created_ts)
      - name: user_id_hashed
        description: Hashed user identifier
      - name: account_type
        description: Type of account
      - name: created_ts
        description: Account creation timestamp (part of natural key with account_id_hashed)

  - name: stg_accounts_closed
    description: Staging layer for account_closed. Deduplicated on (account_id_hashed, closed_ts).
    columns:
      - name: account_id_hashed
        description: Hashed account identifier (part of natural key with closed_ts)
      - name: closed_ts
        description: Account closure timestamp (part of natural key with account_id_hashed)

  - name: stg_accounts_reopened
    description: Staging layer for account_reopened. Deduplicated on (account_id_hashed, reopened_ts).
    columns:
      - name: account_id_hashed
        description: Hashed account identifier (part of natural key with reopened_ts)
        data_tests:
          - not_null
      - name: reopened_ts
        description: Account reopen timestamp (part of natural key with account_id_hashed)
        data_tests:
          - not_null
