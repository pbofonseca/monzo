# Intermediate models: schema and documentation.
# Combines staging tables into unified datasets for downstream marts.

version: 2

models:
  - name: int_account_status_history
    description: |
      Unified timeline of account lifecycle events (created, closed, reopened).
      One row per event per account. Built from stg_accounts_created, stg_accounts_closed,
      and stg_accounts_reopened. Use for account status history, tenure, or funnel analysis.
      Business rule (enforced by singular test int_account_status_history_one_created_first):
      exactly one 'created' per account, and it must be the first event; then only closed/reopened may follow.
    columns:
      - name: account_id_hashed
        description: Hashed account identifier; links all events for the same account.
      - name: event_ts
        description: Timestamp of the lifecycle event (creation, closure, or reopen).
      - name: event_type
        description: |
          Type of event. One of 'created' (account opened), 'closed' (account closed),
          or 'reopened' (account reopened after closure).
      - name: user_id_hashed
        description: Hashed user identifier; populated only for 'created' events, null otherwise.
      - name: account_type
        description: Type of account; populated only for 'created' events, null otherwise.
