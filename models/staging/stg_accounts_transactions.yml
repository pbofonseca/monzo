# Staging models: schema and documentation.
# Uniqueness on natural keys is asserted by singular tests in tests/.

version: 2

models:
  - name: stg_accounts_transactions
    description: Staging layer for account_transactions. Deduplicated on (date, account_id_hashed).
    columns:
      - name: date
        description: Transaction date (part of natural key with account_id_hashed)
      - name: account_id_hashed
        description: Hashed account identifier (part of natural key with date)
      - name: transactions_num
        description: Number of transactions for the account on the date