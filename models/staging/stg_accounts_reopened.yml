# Staging models: schema and documentation.
# Uniqueness on natural keys is asserted by singular tests in tests/.

version: 2

models:
  - name: stg_accounts_reopened
    description: Staging layer for account_reopened. Deduplicated on (account_id_hashed, reopened_ts).
    columns:
      - name: account_id_hashed
        description: Hashed account identifier (part of natural key with reopened_ts)
        data_tests:
          - not_null
      - name: reopened_ts
        description: Account reopen timestamp (part of natural key with account_id_hashed)
        data_tests:
          - not_null