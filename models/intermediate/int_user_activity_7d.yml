version: 2

models:
  - name: int_user_activity_7d
    description: |
      Expands user activity to a 7-day activity window.

      Historical consistency guarantee:
      this model assumes transaction history is append-only.
      Incremental runs repair the last 6 days to ensure
      rolling windows remain deterministic.

      Grain: (activity_day, user_id_hashed)

    columns:
      - name: activity_day
        description: Day when the user should be counted as active.
        tests:
          - not_null

      - name: user_id_hashed
        description: Hashed user identifier.
        tests:
          - not_null

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - activity_day
            - user_id_hashed