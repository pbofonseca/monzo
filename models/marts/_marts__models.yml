# Mart models: dimensions and facts for analytics.
# Dimensions are built from intermediate models.
# See docs/MART_TESTING_OUTLINE.md for the five high-impact tests (dbt + Great Expectations style).

version: 2

models:
  - name: dim_date
    description: |
      Date dimension (calendar) from dbt_date package. One row per day from 2020-01-01 to 2030-12-31.
      Use for date attributes (day_of_week, month_name, quarter, prior_year_date, etc.) in reporting.
    columns:
      - name: date_day
        description: Calendar date (one row per day).
        data_tests:
          - unique
          - not_null

  - name: _expected_dim_account_periods
    description: |
      Test-support view: one row per active period (created or reopened) from int_account_status_history.
      Used by dbt_expectations.expect_table_row_count_to_equal_other_table to reconcile dim_account row count (MART_TESTING_OUTLINE §2).

  - name: dim_account
    description: |
      Account dimension (SCD Type 2) built from int_account_status_history.
      One row per account per active period: from created or reopened until the next closed (or current).
      Use valid_from, valid_to, and is_current for point-in-time and current-state joins.
    data_tests:
      # Row count reconciliation (MART_TESTING_OUTLINE §2 recommended): mart count = expected periods from history.
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          arguments:
            compare_model: ref('_expected_dim_account_periods')
    columns:
      - name: account_sk
        description: Surrogate key; unique per account per version (hash of account_id_hashed and valid_from).
        data_tests:
          - unique
          - not_null
      - name: account_id_hashed
        description: Natural key; hashed account identifier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_account_status_history')
                field: account_id_hashed
      - name: user_id_hashed
        description: Hashed user identifier (from the account created event).
      - name: account_type
        description: |
          Type of account (from the account created event). Source domain: uk_retail_pot, uk_retail, uk_retail_joint.
          Sentinel values: not_informed (source did not provide); not_applied (closed/reopened events; dim gets from created).
        data_tests:
          - accepted_values:
              arguments:
                values: ['uk_retail_pot', 'uk_retail', 'uk_retail_joint', 'not_informed', 'not_applied']
      - name: valid_from
        description: "Start of this version (timestamp when the account became active: created or reopened)."
        data_tests:
          - not_null
      - name: valid_to
        description: "End of this version (timestamp when the account was closed); null if is_current."
      - name: is_current
        description: True if this is the current active version of the account (valid_to is null).
        data_tests:
          - not_null
